name: react-pure-custom-setup
run-name: ${{ github.actor }} is testing out react-pure-custom-setup 🤪
on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
jobs:
  init:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 20.x ]
        docker-version:
    steps:
      - uses: actions/checkout@v4
      - name: setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: setup Docker ${{ matrix.docker-version }}
        uses: actions/setup-docker@v4
        with:
          docker-version: ${{ matrix.docker-version }}
      - name: npm install
        run: npm install
      - name: build
        run: npm run build:prod
      - name: lint:ts
        run: npm run lint:ts
      - name: lint:scss
        run: npm run lint:scss
      - name: test:unit
        run: npm run test:unit
      - name: test:ui
        run: npm run test:ui
      - name: storybook:build
        run: npm run storybook:build
