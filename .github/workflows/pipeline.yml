name: react-pure-custom-setup_pipeline
run-name: ${{ github.actor }} is testing out react-pure-custom-setup 🚀
on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
jobs:
  pipeline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 16.x ]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: install modules
        run: npm install
      - name: build production project
        run: npm run build:prod
        if: always()
      - name: linting typescript
        run: npm run lint:ts
        if: always()
      - name: linting styles
        run: npm run lint:scss
        if: always()
      - name: unit testing
        run: npm run test:unit
        if: always()
      - name: build storybook
        run: npm run storybook:build
        if: always()
      - name: screenshot testing
        id: screenshots
        run: npm run test:ui:ci
        if: always()
      - name: screenshot debug
        if: ${{ failure() && steps.screenshots.conclusion == 'failure' }}
        run:
          date > generated.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f .loki/difference
          git add .
          git checkout -b save-screenshots
          git commit -am "screenshots failure"
          git push -f origin save-screenshots
